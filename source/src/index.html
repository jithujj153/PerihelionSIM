<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PERIHELION · Mine monitoring simulator</title>
<style>/*CSS*/</style>
</head>
<body>
<div id="stage"></div>
<header id="top">
  <div class="brand"><b>PERIHELION</b><span>Independent monitoring · Gandhamardan-B simulation</span></div>
  <div class="seg" id="views"><button data-view="paper">Vendor’s paper</button><button data-view="evidence">System’s evidence</button><button data-view="truth">What actually happened</button></div>
  <div class="tools"><div id="clock">09:00:00</div><button id="play">▶ Play</button><select id="speed" title="Pace"></select><select id="cam" title="Camera (C)"></select><select id="weather" title="Weather"></select><button id="layersBtn">Layers</button><select id="quality" title="Graphics quality"></select><button id="help" title="Keys and assumptions">?</button></div>
</header>
<div id="fps"></div>
<div id="layers" hidden></div>
<div id="banner"></div>
<aside id="side"><nav id="tabs"></nav><div id="panel"></div></aside>
<div id="pip" hidden><span></span></div>
<div id="readout" hidden></div>
<footer id="acts"><button id="prev" title="Previous act (←)">◀</button><div id="actList"></div><button id="next" class="primary" title="Next act (→)">Next act ▶</button><div id="caption"></div></footer>
<div id="hero" hidden></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<div id="loading">PERIHELION<small>Building the site…</small></div>
<script>/*JS*/</script>
</body>
</html>
