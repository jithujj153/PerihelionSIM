<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PERIHELION · Mine monitoring simulator</title>
<style>:root{--panel:rgba(11,18,27,.88);--panel2:rgba(255,255,255,.055);--line:rgba(150,190,225,.18);--text:#e8f0f7;--dim:#93a7bb;--blue:#4cc3ff;--green:#35d07f;--amber:#ffb020;--red:#ff5a4f;--side:372px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b121b;color:var(--text);font:13px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
#stage{position:fixed;inset:0}
#stage canvas{display:block;transition:filter .5s}
#stage canvas.paper{filter:grayscale(.92) sepia(.42) contrast(.92) brightness(1.06)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#labels.paper{filter:grayscale(.8) sepia(.35)}
button,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
select option{background:#101a26}
button:hover:not(:disabled),select:hover{border-color:var(--blue);background:rgba(76,195,255,.13)}
button:disabled{opacity:.45;cursor:default}
.tools button,.tools select,.brand b{white-space:nowrap}
body.hero #labels{opacity:0}#labels{transition:opacity .6s}
button.on{background:rgba(76,195,255,.24);border-color:var(--blue)}
button.primary{background:#1670a8;border-color:#2a93d4}
button.amber{background:rgba(255,176,32,.18);border-color:rgba(255,176,32,.6)}
button.ghost{background:transparent}
button.link{background:none;border:none;padding:0;color:var(--blue);text-decoration:underline}
kbd{font:600 10px/1 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 4px;color:var(--dim)}
/* scene labels */
.tag{text-align:center;white-space:nowrap;pointer-events:none;line-height:1.25;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tag.click{pointer-events:auto;cursor:pointer}
.tag b{display:block;font-size:11.5px;font-weight:650}
.tag i{display:block;font-style:normal;font-size:10.5px;color:#c4d6e6}
.tag i.small{font-size:9.5px;opacity:.75}
.tag u{text-decoration:none;font-weight:700;color:#fff}
.tag.veh,.tag.gate,.tag.pile,.tag.weight,.tag.site,.tag.drone,.tag.warnspot,.tag.zone{background:rgba(9,15,23,.78);border:1px solid rgba(170,205,235,.28);border-radius:7px;padding:3px 8px}
.tag.veh.bg{padding:1px 6px;opacity:.82}.tag.veh.bg i{display:none}
.tag.veh.far i{display:none}
.tag.veh.bad,.tag.pile.bad,.tag.gate.bad,.tag.gate.red,.tag.minor.bad{border-color:var(--red);background:rgba(84,16,14,.88)}
.tag.veh.warn,.tag.gate.amber{border-color:var(--amber);background:rgba(76,50,6,.88)}
.tag.veh.ok,.tag.gate.green{border-color:var(--green)}
.tag.gate.scan{border-color:var(--blue)}
.tag.veh.sel{outline:2px solid #fff}
.tag.veh.dot{width:11px;height:11px;padding:0;border-radius:50%;background:#8fd6ff;border:2px solid #0b1520;opacity:1}.tag.veh.dot *{display:none}.tag.veh.dot.ok{background:var(--green)}
.tag.veh.lost{border-style:dashed}
.tag.minor{opacity:.85}.tag.minor b{font-size:10.5px}.tag.minor i{font-size:9.5px}
.tag.buried b,.tag.buried i{color:#8fe3ff}
.tag.weight{border-color:#5fd8ff;background:rgba(5,45,66,.9);padding:5px 12px}.tag.weight b{font-size:17px}
.tag.warnspot{border:1px dashed #ffd23f}.tag.warnspot b{color:#ffe27a}
.tag.zone{border-color:#6fe3ff}.tag.zone b{font-size:15px;color:#aef0ff}
.tag.drone{padding:1px 6px;border-color:#6fe3ff}
/* top bar */
#top{position:fixed;left:10px;right:10px;top:8px;height:48px;display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);z-index:20}
.brand b{display:block;letter-spacing:.2em;font-size:15px}.brand span{font-size:10.5px;color:var(--dim)}
.seg{display:flex;margin:0 auto;background:rgba(0,0,0,.28);border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;white-space:nowrap;padding:5px 12px;border-radius:7px;color:var(--dim)}
.seg button.on{color:#fff;font-weight:650}
.seg button[data-view=paper].on{background:#7a6a4a}.seg button[data-view=evidence].on{background:#1670a8}.seg button[data-view=truth].on{background:#7d3a8f}
.tools{display:flex;gap:6px;align-items:center}
#clock{font:650 19px/1 ui-monospace,Consolas,monospace;min-width:92px;text-align:right}
#play{min-width:84px}#play.paused{background:#1670a8;border-color:#2a93d4}
#fps{position:fixed;left:14px;top:62px;font-size:10px;color:rgba(255,255,255,.65);text-shadow:0 1px 2px #000;z-index:5}
#layers{position:fixed;right:150px;top:60px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;z-index:30;display:flex;flex-direction:column;gap:6px}
#layers[hidden]{display:none}
/* right panel */
#side{position:fixed;right:10px;top:64px;bottom:104px;width:var(--side);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);z-index:15}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1 0 auto;border:none;border-radius:0;background:transparent;padding:9px 5px;color:var(--dim);font-size:12px;border-bottom:2px solid transparent}
#tabs button.on{color:#fff;border-bottom-color:var(--blue);background:rgba(76,195,255,.08)}
#tabs i{font-style:normal;background:var(--amber);color:#1a1200;border-radius:9px;padding:0 5px;margin-left:4px;font-size:10px;font-weight:700}
#panel{flex:1;overflow-y:auto;padding:10px 12px 20px;scrollbar-width:thin;scrollbar-color:#33485c transparent}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--blue);margin:14px 0 7px;display:flex;justify-content:space-between;gap:8px}
h3:first-child{margin-top:0}h3 small{color:var(--dim);text-transform:none;letter-spacing:0;font-size:10.5px}
.quiet{color:var(--dim);font-size:11.5px;margin:5px 0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid button{text-align:left;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{text-align:left}.chips small{display:block;font-size:10px;color:var(--dim);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:6px}
.stats div{background:var(--panel2);border-radius:8px;padding:5px 2px;text-align:center;border-top:2px solid var(--line)}
.stats b{display:block;font-size:18px}.stats span{display:block;font-size:9.5px;color:var(--dim);line-height:1.2}
.stats .ai{border-top-color:var(--green)}.stats .aip,.stats .per{border-top-color:var(--amber)}.stats .not{border-top-color:var(--red)}
.proposal{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.55);border-radius:10px;padding:9px;margin-bottom:8px}
.proposal .who{display:flex;justify-content:space-between;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--amber)}
.proposal .who span{color:var(--dim);text-transform:none;letter-spacing:0}
.proposal .what{font-weight:650;font-size:13.5px;margin-top:3px}
.why{margin-top:6px;background:rgba(0,0,0,.25);border-radius:7px;padding:6px 8px}
.why p{font-size:11.5px;color:#bfe6ff}
.why table{width:100%;border-collapse:collapse;margin-top:3px}.why td{font-size:11.5px;padding:1px 0;color:var(--dim);vertical-align:top}.why td+td{color:var(--text);text-align:right;padding-left:8px}
.alert{border-left:3px solid var(--dim);background:var(--panel2);border-radius:6px;margin-bottom:5px}
.alert.high{border-left-color:var(--red)}.alert.med{border-left-color:var(--amber)}
.alert .head{display:flex;gap:8px;width:100%;text-align:left;background:none;border:none;padding:6px 8px}
.alert time,.round time,.feed time,.logs time,.qa time{font:11px ui-monospace,Consolas,monospace;color:var(--dim)}
.alert .body{padding:0 8px 8px}.alert .body p{font-size:12px}
.round{display:grid;grid-template-columns:40px 1fr auto;gap:8px;padding:5px 8px;background:var(--panel2);border-radius:6px;margin-bottom:4px;font-size:12px;align-items:center}
.round b{font-size:10.5px;text-transform:uppercase;color:var(--green)}.round.more b,.round.fewer b{color:var(--red)}.round.missed b,.round.recount b{color:var(--amber)}
.meter{margin-bottom:7px;display:grid;grid-template-columns:1fr auto;font-size:11.5px}
.meter span{color:var(--dim)}.meter>div{grid-column:1/3;position:relative;height:6px;background:rgba(255,255,255,.1);border-radius:4px;margin-top:3px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:4px}.meter.warn i{background:var(--amber)}.meter.bad i{background:var(--red)}
.meter em{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff}
.card{background:var(--panel2);border-radius:10px;padding:9px 10px;margin:7px 0}.card.bad{border:1px solid var(--red)}
h4{font-size:12.5px;display:flex;justify-content:space-between;gap:8px}h4 span{color:var(--dim);font-weight:400}
table.kv,table.compare,table.trips{width:100%;border-collapse:collapse;margin-top:5px;font-size:12px}
.kv td{padding:2px 8px 2px 0;color:var(--dim);vertical-align:top}.kv td+td{color:var(--text)}
.compare td{padding:5px 6px;border-bottom:1px solid var(--line)}.compare small{display:block;color:var(--dim);font-size:10px}
.compare td+td{text-align:right;font-weight:650}.compare tr.ok td:last-child{color:var(--green)}.compare tr.bad{background:rgba(255,90,79,.17)}.compare tr.bad td:last-child{color:var(--red)}.compare tr.none{opacity:.5}
.trips th{font-size:10px;text-transform:uppercase;color:var(--dim);text-align:left;padding:2px 4px}.trips td{padding:4px;border-top:1px solid var(--line)}
.trips tr[data-act]{cursor:pointer}.trips tr[data-act]:hover{background:rgba(76,195,255,.12)}
.trips tr.bad td:first-child{box-shadow:inset 3px 0 var(--red)}.trips tr.warn td:first-child{box-shadow:inset 3px 0 var(--amber)}.trips tr.ok td:first-child{box-shadow:inset 3px 0 var(--green)}
.feed>div{display:grid;grid-template-columns:38px 1fr;gap:6px;padding:4px 0;border-bottom:1px solid var(--line);font-size:11.5px}
.feed .bad span{color:#ffb3ad}.feed .warn span{color:#ffd58a}.feed b{display:block;font-size:11px}
.qa{background:var(--panel2);border-radius:10px;padding:9px 10px;margin-bottom:8px;border-left:3px solid var(--green)}.qa.bad{border-left-color:var(--amber)}
.qa h4{justify-content:flex-start;font-weight:600}.qa h4 span{background:var(--blue);color:#04121d;border-radius:50%;width:18px;height:18px;flex:0 0 18px;display:grid;place-items:center;font-size:10.5px;font-weight:700}
.qa .short{font-weight:700;font-size:13.5px;margin:4px 0}.qa p{font-size:12px}
.rank{list-style:none}.rank li{display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--line);padding:4px 0}.rank span{color:var(--amber);font-weight:700}.rank small{grid-column:1/3;color:var(--dim);font-size:10.5px}
.verdict{margin-top:8px;padding:7px 9px;border-radius:7px;font-weight:600}.verdict.ok{background:rgba(53,208,127,.18);color:#9ff0c4}.verdict.bad{background:rgba(255,90,79,.2);color:#ffc0ba}
.logs>div{display:grid;grid-template-columns:38px 1fr;gap:6px;padding:5px 4px;border-bottom:1px solid var(--line);font-size:11.5px}
.logs b{font-size:10px;text-transform:uppercase;color:var(--dim);margin-right:4px}.logs code{display:block;font-size:9.5px;color:#5f7a92}
.logs .r-AI b{color:var(--green)}.logs .r-AIperson b,.logs .r-Person b{color:var(--amber)}.logs .r-Notacted b{color:var(--red)}.logs .broken{background:rgba(255,90,79,.28)}
/* banners */
#banner{position:fixed;top:66px;left:calc((100vw - var(--side) - 10px)/2);transform:translateX(-50%);width:min(620px,calc(100vw - var(--side) - 60px));display:flex;flex-direction:column;gap:7px;z-index:18;pointer-events:none}
.banner{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:11px;padding:9px 14px;backdrop-filter:blur(8px);animation:drop .3s ease-out;pointer-events:auto;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.banner h2{font-size:16px;line-height:1.25}.banner p{font-size:12.5px;color:#cfdeeb}
.banner.ok{border-left-color:var(--green)}.banner.warn{border-left-color:var(--amber)}.banner.bad{border-left-color:var(--red);background:rgba(46,13,14,.92)}
.banner.decision{border:none;background:none;padding:0;backdrop-filter:none;box-shadow:none}.banner.decision .proposal{background:rgba(58,40,6,.95);box-shadow:0 8px 28px rgba(0,0,0,.4)}
.chipsline{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.chipsline span{font-size:11px;background:rgba(255,255,255,.08);border-radius:5px;padding:2px 7px;color:var(--dim)}.chipsline b{color:#fff}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
/* insets */
#pip{position:fixed;left:10px;bottom:104px;width:330px;height:206px;border:2px solid #6fe3ff;border-radius:6px;z-index:10;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#pip span{position:absolute;left:0;top:0;background:rgba(9,15,23,.85);padding:2px 9px;font-size:11px;border-radius:3px 0 7px 0}
#pip span::before{content:"● ";color:var(--red)}
#pip[hidden],#readout[hidden],#modal[hidden],#toast[hidden],#hero[hidden]{display:none}
#readout{position:fixed;left:10px;bottom:104px;width:320px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;z-index:10}
#readout div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:3px 0;font-size:11.5px}#readout b{font-weight:500;color:var(--dim)}#readout span{text-align:right}
#readout .bad span{color:#ffb3ad}#readout .ok span{color:#9ff0c4}
/* act bar */
#acts{position:fixed;left:10px;right:10px;bottom:8px;height:88px;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:46px 1fr;gap:4px 8px;padding:7px 10px;z-index:20}
#actList{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
#actList button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;padding:3px 8px;line-height:1.25;font-size:12px}
#actList small{display:block;font-size:9.5px;color:var(--dim)}#actList .done{opacity:.65}#actList .on{background:#1670a8;border-color:#6fd0ff;opacity:1;font-weight:650}
#caption{grid-column:1/4;font-size:13.5px;text-align:center;align-self:center}#caption small{text-transform:uppercase;font-size:9.5px;letter-spacing:.09em;color:var(--blue);margin-right:8px}
/* hero, modal, toast */
#hero{position:fixed;inset:0 var(--side) 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:12;pointer-events:none;background:radial-gradient(ellipse at center,rgba(6,12,20,.62),rgba(6,12,20,0) 70%);text-shadow:0 2px 16px rgba(0,0,0,.7)}
#hero.go{animation:hero linear forwards}
#hero h1{font-size:62px;letter-spacing:.32em;margin-right:-.32em}#hero p{font-size:20px;margin-top:4px}#hero small{margin-top:10px;color:#bcd3e8;font-size:13px}
@keyframes hero{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}
#modal{position:fixed;inset:0;background:rgba(4,9,15,.72);z-index:40;display:grid;place-items:center;padding:20px}
.sheet{width:min(1060px,100%);max-height:100%;overflow:auto;background:#0f1925;border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.sheet header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.sheet h1{font-size:22px}.sheet header p{color:var(--dim)}
.six{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.six>div{background:var(--panel2);border-radius:10px;padding:12px;border-top:3px solid var(--green)}.six>div.bad{border-top-color:var(--amber)}
.six span{font-size:11px;color:var(--blue);font-weight:700}.six h4{font-weight:500;color:var(--dim);margin:2px 0 6px}.six b{font-size:16px;line-height:1.3;display:block}
.foot,.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.cols{grid-template-columns:1fr 1.5fr}
.foot p{margin-top:4px}.foot small{color:var(--dim);display:block;margin-top:4px}.good{color:#9ff0c4}.badt{color:#ffc0ba}.cols h4{margin-top:8px}.cols p{color:#cfdeeb;font-size:12.5px;margin-top:2px}
#toast{position:fixed;left:calc((100vw - var(--side))/2);transform:translateX(-50%);top:46%;max-width:560px;background:#0f1925;border:1px solid var(--green);border-radius:9px;padding:8px 16px;z-index:35;box-shadow:0 8px 24px rgba(0,0,0,.4)}#toast.no{border-color:var(--amber)}
#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#0b121b;z-index:100;font-size:16px;letter-spacing:.08em}#loading small{display:block;color:var(--dim);margin-top:8px;letter-spacing:0}
/* presenter's clean screen */
body.bare #top,body.bare #side,body.bare #acts,body.bare #readout,body.bare #pip,body.bare #fps{display:none}
body.bare{--side:0px}
@media (max-width:1750px){.brand span{display:none}}
@media (max-width:1500px){:root{--side:334px}.seg button{padding:5px 7px;font-size:11.5px}.tools{gap:4px}.tools button,.tools select{font-size:12px;padding:5px 6px}.tools select{max-width:124px}.brand b{letter-spacing:.14em}#top{gap:8px}#actList button{font-size:11px;padding:3px 5px}#tabs button{font-size:11px}}
@media (max-width:1180px){#fps{display:none}.brand b{font-size:12px}.tools select{max-width:86px}#clock{font-size:15px;min-width:72px}#play{min-width:70px}}
@media (max-height:760px){#pip{width:260px;height:162px}#hero h1{font-size:46px}}
</style>
</head>
<body>
<div id="stage"></div>
<header id="top">
  <div class="brand"><b>PERIHELION</b><span>Independent monitoring · Gandhamardan-B simulation</span></div>
  <div class="seg" id="views"><button data-view="paper">Vendor’s paper</button><button data-view="evidence">System’s evidence</button><button data-view="truth">What actually happened</button></div>
  <div class="tools"><div id="clock">09:00:00</div><button id="play">▶ Play</button><select id="speed" title="Pace"></select><select id="cam" title="Camera (C)"></select><select id="weather" title="Weather"></select><button id="layersBtn">Layers</button><select id="quality" title="Graphics quality"></select><button id="help" title="Keys and assumptions">?</button></div>
</header>
<div id="fps"></div>
<div id="layers" hidden></div>
<div id="banner"></div>
<aside id="side"><nav id="tabs"></nav><div id="panel"></div></aside>
<div id="pip" hidden><span></span></div>
<div id="readout" hidden></div>
<footer id="acts"><button id="prev" title="Previous act (←)">◀</button><div id="actList"></div><button id="next" class="primary" title="Next act (→)">Next act ▶</button><div id="caption"></div></footer>
<div id="hero" hidden></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
